name: Release Please

# Watches the Conventional Commits on `main`, maintains a release PR
# that bumps `package.json` + `CHANGELOG.md` + `.release-please-manifest.json`,
# and cuts a tag + GitHub Release when the release PR merges. The release
# event is what the future Phase 6 `deploy-prod.yml` listens to.
#
# Versioning policy:
# - Starts at `0.1.0`. Bumps to `1.0.0` at seqtek.com cutover via an
#   explicit `release-as: 1.0.0` commit footer.
# - `bump-minor-pre-major: true` keeps `feat:` -> minor in the 0.x range
#   so feature commits don't get lost in patch noise.
# - No major bumps past 1.0 until we ship a public API (e.g., client
#   portal / AI portal). Avoid `feat!:` / `BREAKING CHANGE:` footers.
#
# CHANGELOG scope: `feat`, `fix`, `perf`, `revert` only. `ci` / `docs` /
# `chore` / `test` / `style` / `refactor` / `build` are dropped so the
# CHANGELOG reads as a user-facing release log.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch Deploy when a release is cut (see the final step)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Bootstrap from the spec-002 closing commit so the first
          # CHANGELOG starts fresh with the next `feat:` / `fix:`. Spec
          # 002 itself is already documented in PROJECT_HISTORY.md.
          # This input is a no-op once the first release tag exists.
          bootstrap-sha: f311262f6f3b4684df5f771d9729e37b66beece1

      # Production deploys are dispatched from HERE, not from deploy.yml's
      # `release: [published]` trigger, and the reason is subtle enough to be
      # worth stating plainly:
      #
      # This action authenticates with the default GITHUB_TOKEN, and GitHub does
      # not create workflow runs from events raised by GITHUB_TOKEN. So the
      # release it publishes CANNOT trigger `on: release` — the production path
      # would be inert, with no failed run and no notification to reveal it.
      # `workflow_dispatch` is one of the two documented exceptions to that rule
      # (alongside `repository_dispatch`), so dispatching explicitly is what
      # actually works without minting a PAT.
      #
      # deploy.yml keeps its `release: [published]` trigger for releases a HUMAN
      # publishes from the UI, which do fire normally. If this action is ever
      # given a PAT, both paths fire and the second is a redundant redeploy of
      # the same tag — the `deploy-prod` concurrency group serialises them.
      - name: Deploy the release to production
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "Release $TAG created — dispatching Deploy (prod) at that tag."
          gh workflow run deploy.yml --ref "$TAG" -f env=prod -f stack-filter='*Compute'
