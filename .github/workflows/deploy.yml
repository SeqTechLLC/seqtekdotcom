name: Deploy

# PROMOTION MODEL — what deploys where, and why.
#
#   merge to `main`            →  preview.seqtek.com  (UAT, primary lane.
#                                                       BUILDS the image.)
#   publish a GitHub Release   →  ww3.seqtek.com      (PROD, secondary lane.
#                                                       Promotes an existing
#                                                       image. NO build.)
#
# ONE BUILD, ONE UAT DEPLOY, ONE PROMOTION. An ordinary merge to `main` builds
# the image once, tags it with the commit SHA, and puts it on preview. That is
# the artifact. Publishing the release points production at THAT SAME image —
# nothing is compiled, nothing is pushed, a task definition is repointed at a
# digest that already exists.
#
# EXACTLY ONE EVENT PROMOTES PRODUCTION: publishing a GitHub Release. You cut
# one by hand against `main`, e.g.
#
#     gh release create v0.0.43 --title "v0.0.43" --generate-notes --target main
#
# `--target main` points the tag at the current tip, which an ordinary merge has
# already built and deployed to preview — so the release promotes an image that
# exists and was tested. `--generate-notes` writes the notes from the commits in
# the range.
#
# Creating it yourself is also what makes the event fire: GitHub raises no
# workflow run for a release published by the default GITHUB_TOKEN, which is why
# an automated release bot needed a `workflow_dispatch` workaround. Release-
# Please has been retired — it landed a bookkeeping commit on `main` that
# triggered a second build and a redundant preview roll for a change that was
# only a version number.
#
# THE VERSION IS RUNTIME METADATA, NOT A REBUILD. A tested image is never
# rebuilt merely to bake a version number into it. The commit SHA stays baked
# in, because it identifies the actual artifact. The semantic version is
# attached at release time two ways, neither of which touches the image: the
# same ECR digest gets `vX.Y.Z` as an additional tag, and the production task
# definition receives `RELEASE_VERSION`. /api/health reports the release
# version when present, falling back to the version baked at build time.
#
# A `main` merge is NOT a release. It briefly was, and that let a merge reach
# production unattended — the container applies database migrations on start,
# so merging became a schema change with no human in between. Merging is
# frequent and low-ceremony; promoting production is a decision someone makes.
#
# ONE deployment branch. `Preview` used to deploy here too and pointed at the
# same primary lane `main` now owns — two triggers racing one CloudFormation
# stack (hence the constant concurrency group below). Two long-lived
# deployment branches also drift, and the drift gets "fixed" by landing
# hotfixes on one of them.
#
# BOTH lanes' image tags are stated on EVERY deploy, and exactly one moves.
# `cdk deploy` re-synthesizes the whole stack, so both task definitions are
# re-rendered every run; the lane that is not moving is pinned to the value it
# already carries, read back from its live ECS service, making that half of the
# synth a no-op. `RELEASE_VERSION` is pinned the same way and for the same
# reason. compute-stack.ts has NO fallback for `secondaryImageTag` — a deploy
# that cannot say what production should run fails the synth rather than
# guessing, because a fallback there once promoted an untested build.
#
# Neither path deploys the never-provisioned `envName: prod` CDK env (decided
# 2026-08-12: no AWS account, no infra, and the account is at its 5-VPC limit).
# ww3 is a second ECS task/service/target-group inside the SAME
# `SeqtekPreviewCompute` stack — see compute-stack.ts `secondaryLane`.
#
# ww3.seqtek.com is production: the finished site behind a DNS record, so going
# live is a Route53 change rather than a deploy. Both lanes are Cognito-gated
# until then, and that gate is index control — it keeps search engines out.
#
# `workflow_dispatch` exists for the cases a trigger can't cover: the FIRST
# deploy into a fresh account (no release to replay), a stack-scoped redeploy,
# or re-running a deploy without cutting a version. Its `env: prod` choice
# takes the SAME release path (IS_RELEASE=true) for a manual promotion
# without cutting an actual release.
#
# Account resolution: preview and production each set their own account ID
# as an environment-scoped SECRET (not a Variable — this repo is public, and
# Variables are plaintext-visible to anyone with a GitHub account, same
# exposure as a committed file; Secrets are masked and hidden after
# creation). `${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}` reads the
# Secret when set, falling back to the (now-unused, staging-era) repo-level
# Variable otherwise — preview and production both point at the SAME account
# (a release/main-push promotes a lane INSIDE the preview account, not a
# separate one). The ECR repository and the account-wide OIDC provider each have an
# explicit owner in `infra/cdk.json`
# (`ownsAccountEcrRepository` / `ownsAccountOidcProvider`), set `true` on
# every env that owns one in its own account. See ARCHITECTURE.md §
# Environments & isolation.

on:
  push:
    branches:
      # ONE deployment branch, deliberately. `Preview` used to deploy here
      # too, and pointed at the same primary lane `main` now owns — two
      # triggers racing one CloudFormation stack (hence the constant
      # concurrency group below). Two long-lived deployment branches also
      # drift, and the drift gets "fixed" by landing hotfixes on one of
      # them. `Preview` remains a normal branch; it just no longer deploys.
      - main
    # Skip the redeploy for changes that can't affect the running image.
    # `paths-ignore` skips the workflow entirely only if EVERY changed path
    # matches — a mixed code+docs commit still triggers.
    paths-ignore:
      # Deliberately NOT package.json / package-lock.json: a dependency bump
      # changes the lockfile and MUST rebuild and redeploy. Only files that
      # cannot affect the running image belong here.
      - CHANGELOG.md
      - docs/**
      - specs/**
      - README.md
      - CLAUDE.md
      - LICENSE
  # THE production trigger — the only one. Fires when a person publishes a
  # GitHub Release, e.g.
  #   gh release create v0.0.43 --title "v0.0.43" --generate-notes --target main
  # That the publisher is a human is what makes the event exist: GitHub creates
  # no workflow run for a release published by the default GITHUB_TOKEN.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        default: preview
        type: choice
        options:
          - preview
          - prod
      stack-filter:
        description: >-
          CDK stack glob, WITHOUT the Seqtek<Env> prefix (it is prepended from
          `env`). Default `*Compute` redeploys just the app tier. Use `*` for a
          full-environment redeploy. The FIRST deploy into a new account is done
          locally instead (runbook §1.5) — this workflow cannot bootstrap it,
          since the deploy role it assumes is created by the Network stack.
        default: '*Compute'
        type: string

permissions:
  id-token: write
  contents: read
  deployments: write # so the GitHub Environment records the deployment

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-east-1
  ECR_REPOSITORY: seqtek-website

# Pairs with CloudFormation's native stack-update lock — a second run started
# while one is in flight queues rather than racing. Never cancel a deploy
# mid-flight (FR-016). EVERY trigger now touches the SAME
# `SeqtekPreviewCompute` stack (staging is retired — see the promotion-model
# comment above), so there is exactly ONE concurrency group, a constant, not
# a ternary. A main push racing a Preview push would otherwise be a genuine
# CloudFormation concurrent-update conflict, not just wasted queue time.
concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    # Two GitHub Environments, ONE CDK/AWS target (the preview account —
    # staging's separate account is retired, nothing deploys there anymore).
    # `production` is still the human-facing gate for whatever promotes the
    # secondary (ww3) lane — a `main` push now included, alongside the
    # existing release/`env=prod` dispatch paths — via required reviewers /
    # deployment branch policy on that Environment. `preview` gates the
    # ordinary Preview-branch push, which only ever touches the primary lane.
    environment:
      ${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') && 'production' ||
      'preview' }}
    outputs:
      site-url: ${{ steps.site.outputs.url }}
    env:
      # IS_RELEASE distinguishes "merge to `main` — only the PRIMARY
      # (preview.seqtek.com) lane moves" from "release or manual prod
      # promotion — only the SECONDARY (ww3.seqtek.com) lane moves". Both
      # deploy the SAME `env=preview` CDK stacks in the SAME account; they
      # differ in image-tag wiring below and in which GitHub Environment
      # gates them above.
      #
      # A `main` push is deliberately NOT a release. It was between
      # 2026-08-14 (#103) and this change, and that is what let a merge
      # reach production unattended — `Dockerfile`'s CMD runs
      # `payload migrate` on start, so a merge became a schema change on
      # `seqtek_prod` with no human in between. Merging is frequent and
      # low-ceremony; promoting production should not be.
      IS_RELEASE:
        ${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') && 'true' ||
        'false' }}
      # Every trigger targets the SAME 'preview' CDK env/account now —
      # staging is retired, so these are constants, not a ternary. STACK_PREFIX
      # must match `stackName()` in infra/lib/construct-utils.ts.
      ENV_NAME: preview
      STACK_PREFIX: SeqtekPreview
      ROLE_NAME: SeqtekPreviewDeploy
      STACK_FILTER: SeqtekPreview${{ github.event.inputs.stack-filter || '*Compute' }}
    steps:
      # FAIL CLOSED on an unconfigured production environment.
      #
      # GitHub auto-creates an environment that a workflow references but that
      # does not exist — with no protection rules and no secrets. Since the prod
      # OIDC trust now pins `environment:production` rather than a git ref, that
      # auto-created environment would satisfy the trust and deploy completely
      # ungated. The old ref pin at least failed closed; this restores that
      # property from inside the repo, where it can't be forgotten.
      #
      # Set `PROD_ENVIRONMENT_CONFIGURED=true` as a variable ON the production
      # environment once its deployment branch/tag policies (and reviewers, if
      # any) are in place — docs/INFRASTRUCTURE_RUNBOOK.md §1.2.
      - name: Refuse an unconfigured production environment
        if: ${{ env.IS_RELEASE == 'true' }}
        run: |
          if [ "${{ vars.PROD_ENVIRONMENT_CONFIGURED }}" != "true" ]; then
            echo "::error::The 'production' GitHub Environment is not configured."
            echo "::error::Set its deployment branch/tag policies, then set the"
            echo "::error::variable PROD_ENVIRONMENT_CONFIGURED=true on that"
            echo "::error::environment. See docs/INFRASTRUCTURE_RUNBOOK.md §1.2."
            exit 1
          fi
          echo "production environment reports configured."

      # On a release, build the TAGGED commit, not whatever main has drifted
      # to since the release PR merged.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Configure AWS credentials (${{ env.ENV_NAME }} OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-deploy-${{ env.ENV_NAME }}-${{ github.run_id }}

      - name: Resolve ECR registry + image tags
        id: img
        run: |
          set -euo pipefail
          REGISTRY="${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          SHA_TAG="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          # Release version, derived from the REF rather than the event name,
          # so it works on both the `release` event and a `workflow_dispatch`
          # run against a tag. Empty on an ordinary merge to `main`; that is
          # correct — an unreleased build has no release version.
          VERSION_TAG=""
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION_TAG="${GITHUB_REF#refs/tags/}" ;;
          esac
          # Version from package.json, baked into the image as a FALLBACK for
          # /api/health on a lane that has never been released. The real
          # release version arrives as runtime metadata at promotion time, so
          # this is not what a released lane reports.
          PKG_VERSION="$(node -p "require('./package.json').version")"
          {
            echo "registry=${REGISTRY}"
            echo "image=${IMAGE}"
            echo "sha-tag=${SHA_TAG}"
            echo "version-tag=${VERSION_TAG}"
            echo "pkg-version=${PKG_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: ECR login
        # Build-only; a release promotes an existing image.
        if: ${{ env.IS_RELEASE != 'true' }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.img.outputs.registry }}"

      - name: Set up Docker Buildx
        # Build-only; a release promotes an existing image.
        if: ${{ env.IS_RELEASE != 'true' }}
        uses: docker/setup-buildx-action@v3

      # NOT on the release path. A release PROMOTES an image that a `main`
      # push already built, tested on preview, and pushed to ECR under its
      # commit SHA — it does not produce a new one. Rebuilding at release
      # time would ship bits nobody tested: `Dockerfile:12` pins the base by
      # TAG (`node:24.11.1-alpine`, which Alpine re-pushes on patch) and
      # `npm ci` fetches tarballs at build time, so an identical source tree
      # is not guaranteed to yield an identical image.
      - name: Build + push image
        if: ${{ env.IS_RELEASE != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          # Immutable tags only. When both environments share one account they
          # share the `seqtek-website` repository, so a bare moving `:latest`
          # rewritten by every staging merge would be picked up by production on
          # its next instance replacement. The SHA (or `vX.Y.Z`) tag is what
          # makes "merging to main does not touch production" true at the image
          # layer and not only at the trigger layer. `:latest-<env>` remains as
          # a convenience pointer; nothing deploys from it.
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.sha-tag }}
            ${{ steps.img.outputs.image }}:latest-${{ env.ENV_NAME }}
            ${{ steps.img.outputs.version-tag != '' && format('{0}:{1}', steps.img.outputs.image, steps.img.outputs.version-tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* client IDs are build-time-inlined into the browser
          # bundle, so runtime SSM provisioning can't deliver them — they ride
          # as build args. All values are public by definition (shipped to
          # every visitor's browser; portal ID + workshop GUID are committed
          # in INTEGRATIONS.md §1.2). CI's own builds pass no args, keeping
          # test runs hermetic (forms stay in stub mode there by design).
          #
          # NEXT_PUBLIC_HUBSPOT_CONTACT_FORM_ID set 2026-06-22: Chad created the
          # Contact form; the GUID was verified by a test submit (all fields
          # accepted, CAPTCHA off — INTEGRATIONS.md §1.2). Live on next deploy.
          #
          # Deliberately EMPTY until their gates clear:
          #  - NEXT_PUBLIC_GTM_ID: GTM-54KBJ2Z3 is the LIVE Wix-era container;
          #    loading it on staging before the spec 008 container rebuild
          #    would fire its legacy tags uncontrolled. Set it as part of the
          #    spec 008 GTM-UI/staging tail.
          build-args: |
            NEXT_PUBLIC_HUBSPOT_PORTAL_ID=8504846
            NEXT_PUBLIC_HUBSPOT_WORKSHOP_FORM_ID=66dba2bf-f099-44d5-8c6e-f24292cefe53
            NEXT_PUBLIC_HUBSPOT_CONTACT_FORM_ID=8dc61ff4-9f95-46c5-b43e-8c82a394de42
            NEXT_PUBLIC_GTM_ID=
            BUILD_VERSION=${{ steps.img.outputs.pkg-version }}
            BUILD_COMMIT=${{ steps.img.outputs.sha-tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install infra dependencies
        run: npm --prefix infra ci

      # RELEASE PATH ONLY. A release must not drift the PRIMARY lane's task
      # definition just because it ran — it promotes ONLY the secondary (ww3)
      # lane. Re-synthing `SeqtekPreviewCompute` touches BOTH lanes' task
      # definitions, so the primary lane's `-c imageTag` has to be pinned to
      # whatever it is ALREADY running (read straight from the live ECS
      # service), making that half of the synth a byte-for-byte no-op.
      # Falling back to the compute-stack.ts default (`latest-preview`)
      # instead would silently roll the primary lane back/forward to
      # whatever that moving tag currently points at — exactly the drift
      # this whole immutable-tag design exists to prevent.
      # RELEASE PATH ONLY. The release is created against `main`
      # (`gh release create vX.Y.Z --target main`), so the tag points at a real
      # commit that an ordinary merge already built, pushed, and deployed to
      # preview. That image is the release artifact; nothing is built here.
      #
      # If it is missing, stop. A tag created against a commit that never built
      # — or one whose build is still running — must not silently become a
      # production deploy of something else.
      - name: Verify the promoted image exists in ECR (release path only)
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          PROMOTE_TAG: ${{ steps.img.outputs.sha-tag }}
          VERSION_TAG: ${{ steps.img.outputs.version-tag }}
        run: |
          set -euo pipefail
          if ! aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$PROMOTE_TAG" >/dev/null 2>&1; then
            echo "::error::No image tagged '${PROMOTE_TAG}' in ${ECR_REPOSITORY}."
            echo "::error::A release promotes an image that a merge to main already"
            echo "::error::built and deployed to preview. Either that build has not"
            echo "::error::finished, or the tag points at a commit that never built."
            echo "::error::Check the Deploy run for commit ${GITHUB_SHA}."
            exit 1
          fi
          echo "Promoting existing image: ${PROMOTE_TAG}"

          # Give that SAME digest the release version as an extra ECR tag, so
          # `vX.Y.Z` and the SHA name one artifact. put-image attaches a tag to
          # the existing manifest — no pull, no push, no rebuild.
          if [ -n "${VERSION_TAG:-}" ]; then
            MANIFEST=$(aws ecr batch-get-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$PROMOTE_TAG" \
              --query 'images[0].imageManifest' --output text)
            if aws ecr put-image --repository-name "$ECR_REPOSITORY" \
              --image-tag "$VERSION_TAG" --image-manifest "$MANIFEST" >/dev/null 2>&1; then
              echo "Tagged ${PROMOTE_TAG} as ${VERSION_TAG} in ECR."
            else
              echo "::notice::${VERSION_TAG} already tags this digest."
            fi
          fi

      - name: Resolve the tested image from the preview lane (release path only)
        id: pin
        if: ${{ env.IS_RELEASE == 'true' }}
        run: |
          set -euo pipefail
          CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_PREFIX}Compute" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue | [0]" \
            --output text)
          SERVICE=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_PREFIX}Compute" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceName'].OutputValue | [0]" \
            --output text)
          TASKDEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TASKDEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          PINNED_TAG="${IMAGE##*:}"
          if [ -z "$PINNED_TAG" ] || [ "$PINNED_TAG" = "None" ]; then
            echo "::error::Could not read the tag the preview lane is running."
            echo "::error::Refusing to deploy: this run cannot state what preview"
            echo "::error::should keep running, and there is no fallback."
            exit 1
          fi
          echo "Preview lane is running ${PINNED_TAG} (holding it there)."
          echo "pinned-image-tag=${PINNED_TAG}" >> "$GITHUB_OUTPUT"

      # NON-RELEASE PATH. Mirror image of the step above, and the reason the
      # `|| imageTag` fallback could be deleted from compute-stack.ts.
      #
      # A `main` push moves ONLY the primary lane, but re-synthing the stack
      # re-renders BOTH task definitions — so this deploy has to state what
      # production should keep running. It reads that back from the live ECS
      # service, making the secondary half of the synth a byte-for-byte no-op.
      #
      # The CfnOutput is preferred, but it does not exist in the deployed
      # stack until the first deploy that carries it, so fall back to
      # locating the service by name within the cluster. Without either, the
      # synth fails closed rather than guessing — which is the whole point.
      - name: Resolve currently-deployed prod image tag (non-release path only)
        id: pinprod
        if: ${{ env.IS_RELEASE != 'true' }}
        run: |
          set -euo pipefail
          CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_PREFIX}Compute" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue | [0]" \
            --output text)
          SERVICE=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_PREFIX}Compute" \
            --query "Stacks[0].Outputs[?OutputKey=='SecondaryLaneServiceName'].OutputValue | [0]" \
            --output text)
          if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ]; then
            # The CfnOutput only exists once a deploy carrying it has run, so
            # the FIRST deploy after it was added has to find the service
            # another way. Resolved from the stack's own resources rather than
            # `ecs:ListServices`, which the deploy role deliberately does not
            # grant (it scopes ECS reads to describe-style calls). The
            # PhysicalResourceId of an AWS::ECS::Service is its ARN.
            echo "SecondaryLaneServiceName output not present yet; resolving from stack resources."
            SERVICE=$(aws cloudformation describe-stack-resources \
              --stack-name "${STACK_PREFIX}Compute" \
              --query "StackResources[?ResourceType=='AWS::ECS::Service' && contains(LogicalResourceId, 'SecondaryLane')].PhysicalResourceId | [0]" \
              --output text)
          fi
          if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ]; then
            echo "::error::Could not resolve the secondary (prod) lane's ECS service."
            echo "::error::Refusing to deploy: this run cannot state what prod should run,"
            echo "::error::and there is deliberately no fallback (see compute-stack.ts)."
            exit 1
          fi
          TASKDEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TASKDEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          PINNED_TAG="${IMAGE##*:}"
          echo "Prod lane is currently running tag: ${PINNED_TAG} (holding it there)"
          echo "pinned-prod-tag=${PINNED_TAG}" >> "$GITHUB_OUTPUT"
          # Same reasoning as the image tag: re-synthing re-renders this task
          # definition, so the release version it already carries has to be
          # restated or it is wiped. Empty on a lane never released.
          PINNED_VERSION=$(aws ecs describe-task-definition \
            --task-definition "$TASKDEF_ARN" \
            --query "taskDefinition.containerDefinitions[0].environment[?name=='RELEASE_VERSION'].value | [0]" \
            --output text)
          [ "$PINNED_VERSION" = "None" ] && PINNED_VERSION=""
          echo "Prod lane release version: ${PINNED_VERSION:-<none>} (holding it there)"
          echo "pinned-release-version=${PINNED_VERSION}" >> "$GITHUB_OUTPUT"

      - name: cdk deploy (${{ env.STACK_FILTER }})
        # `-c imageTag` stamps the task definition with the IMMUTABLE tag just
        # pushed — `vX.Y.Z` on a release, the commit SHA otherwise — so a task
        # replaced later re-pulls that exact build rather than whatever a
        # moving tag has come to point at, and rollback is a redeploy of an
        # older tag. On a release, IMAGE_TAG is instead the PINNED tag from
        # the step above (see its comment) and SECONDARY_IMAGE_TAG carries the
        # new release tag onto ONLY the secondary lane.
        env:
          # Exactly ONE lane moves per deploy; the other is pinned to what it
          # is already running. Both are always stated — see the guard in
          # compute-stack.ts for why there is no fallback.
          #
          # The deployed tag is always the commit SHA, never `vX.Y.Z`. The SHA
          # identifies the artifact; the release version is metadata ABOUT that
          # artifact and travels separately, below.
          IMAGE_TAG: ${{ env.IS_RELEASE == 'true' && steps.pin.outputs.pinned-image-tag ||
            steps.img.outputs.sha-tag }}
          SECONDARY_IMAGE_TAG: ${{ env.IS_RELEASE == 'true' && steps.img.outputs.sha-tag ||
            steps.pinprod.outputs.pinned-prod-tag }}
          # Semantic version as RUNTIME metadata on the production lane, so a
          # tested image is never rebuilt just to carry a version number. On a
          # release this is the tag being published; otherwise it is whatever
          # production already carries, read back from its live task definition
          # — the same pinning discipline as the image tag, and for the same
          # reason: re-synthing re-renders that task definition, so a deploy
          # that omitted it would wipe it.
          RELEASE_VERSION: ${{ env.IS_RELEASE == 'true' && steps.img.outputs.version-tag ||
            steps.pinprod.outputs.pinned-release-version }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAG" ] || [ -z "$SECONDARY_IMAGE_TAG" ]; then
            echo "::error::Both image tags must be resolved before deploying."
            echo "::error::primary='${IMAGE_TAG}' secondary='${SECONDARY_IMAGE_TAG}'"
            exit 1
          fi
          if [ "${IS_RELEASE}" = "true" ]; then
            echo "Release: promoting prod (ww3) lane to ${SECONDARY_IMAGE_TAG}"
            echo "         holding preview lane at ${IMAGE_TAG}"
          else
            echo "Main push: moving preview lane to ${IMAGE_TAG}"
            echo "           holding prod (ww3) lane at ${SECONDARY_IMAGE_TAG}"
          fi
          npm --prefix infra run cdk -- deploy -c env="$ENV_NAME" -c imageTag="$IMAGE_TAG" \
            -c "secondaryImageTag=$SECONDARY_IMAGE_TAG" \
            -c "releaseVersion=$RELEASE_VERSION" "$STACK_FILTER" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      # NO explicit instance refresh.
      #
      # It used to be required: with a moving `:latest` tag the UserData was
      # byte-identical between deploys, so CDK produced no LaunchTemplate change
      # and the ASG never rolled — the new image had to be forced in.
      #
      # With an immutable `-c imageTag`, the UserData now differs on every new
      # build, so the LaunchTemplate gets a new version, and the ASG references
      # it by `LatestVersionNumber` — CloudFormation performs the rolling update
      # itself (MaxBatchSize 1, MinInstancesInService = asgMinCapacity) and
      # `cdk deploy` blocks until it finishes and the instances are healthy.
      # Triggering a refresh on top of that would replace every instance a
      # SECOND time on every deploy. Re-deploying an unchanged tag is correctly
      # a no-op: same image, nothing to roll.

      - name: Resolve site URL (from ${{ env.STACK_PREFIX }}Edge output)
        id: site
        # A release only ever changed the secondary lane, so it reports (and
        # the smoke job below tests) SecondaryLaneSiteUrl — e.g.
        # https://ww3.seqtek.com/ — not the primary SiteUrl, which a release
        # never touches.
        env:
          OUTPUT_KEY: ${{ env.IS_RELEASE == 'true' && 'SecondaryLaneSiteUrl' || 'SiteUrl' }}
        run: |
          set -euo pipefail
          URL=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_PREFIX}Edge" \
            --query "Stacks[0].Outputs[?OutputKey=='${OUTPUT_KEY}'].OutputValue | [0]" \
            --output text)
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "Could not resolve ${STACK_PREFIX}Edge ${OUTPUT_KEY} output."
            exit 1
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Post-deploy smoke
    needs: deploy
    runs-on: ubuntu-latest
    # Runs inside the official Playwright image — browsers + system libs
    # preinstalled. The `npx playwright install --with-deps chromium` apt-get
    # hang on bare GH-hosted runners is the reason this job is split out.
    # Bump the tag in lockstep with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Post-deploy smoke
        env:
          # POST_DEPLOY_URL drives the spec under test.
          # PLAYWRIGHT_BASE_URL is what playwright.config.ts checks to skip
          # spinning up the local `npm run dev` webServer — that webServer
          # path needs PAYLOAD_SECRET / DATABASE_URL and is only meant for
          # the PR-time tests job. Setting PLAYWRIGHT_BASE_URL switches us
          # into the external-server branch of the config.
          POST_DEPLOY_URL: ${{ needs.deploy.outputs.site-url }}
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.site-url }}
        run: npx playwright test tests/e2e/post-deploy-smoke.e2e.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-playwright-report
          path: playwright-report/
          retention-days: 7

  notify:
    name: Notify Slack
    needs: [deploy, smoke]
    # Report every deploy outcome (success and failure), but stay quiet if the
    # run was cancelled. A failed/skipped `deploy` makes `smoke` skip, so
    # success requires BOTH jobs green. `site-url` (e.g. https://preview.seqtek.com/)
    # flows straight through from the `deploy` job's `Resolve site URL` step —
    # slack-notify.yml renders it as a clickable link in the message.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      # Must match IS_RELEASE in the deploy job. A `main` push is a PREVIEW
      # deploy now; labelling it "production" made the first run under the
      # new model report the wrong environment.
      workflow-name:
        Deploy (${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') &&
        'production' || 'preview' }})
      status: ${{ (needs.deploy.result == 'success' && needs.smoke.result == 'success') && 'success' || 'failure' }}
      site-url: ${{ needs.deploy.outputs.site-url }}
    secrets: inherit
