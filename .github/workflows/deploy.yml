name: Deploy

# PROMOTION MODEL — what deploys where, and why.
#
#   merge to `main`              →  STAGING / UAT  (seqtek-preview.com)
#   publish a `vX.Y.Z` release   →  PRODUCTION     (seqtek.com)
#
# Merging to main is NOT a production deploy. main is the preview/UAT
# environment: every merged PR lands there immediately so it can be reviewed
# against real infrastructure. Production moves only when a Release-Please
# release is published — i.e. when someone merges the release PR, which cuts
# the `vX.Y.Z` tag and the GitHub Release this workflow listens for. That is
# the deliberate human gate on going live, and it is why cutting a release is
# treated as an outward-facing action.
#
# Release-Please tags are `vX.Y.Z` (`include-v-in-tag: true`,
# `include-component-in-tag: false` in release-please-config.json), and
# `release-please.yml` has always named this workflow as the consumer of that
# release event.
#
# `workflow_dispatch` exists for the cases a trigger can't cover: the FIRST
# deploy into a fresh account (no release to replay), a stack-scoped redeploy,
# or re-running a deploy without cutting a version.
#
# The two environments can live in DIFFERENT AWS accounts. Everything account-
# specific resolves through `vars.AWS_ACCOUNT_ID`, read from the GitHub
# *Environment* (Settings → Environments → staging / production) rather than
# the repo-level variable. Set it per environment and this one workflow targets
# either account with no code change; an environment that doesn't define it
# inherits the repo-level value, which is why staging keeps working untouched.

on:
  push:
    branches:
      - main
    # Skip staging redeploy for changes that can't affect the running
    # image. Release-Please's PR-merges and docs-only PRs both fall into
    # this bucket. `paths-ignore` skips the workflow entirely if EVERY
    # changed path matches — mixed code+docs commits still trigger.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - docs/**
      - specs/**
      - README.md
      - CLAUDE.md
      - LICENSE
  # Production. Fires when Release-Please's release PR is merged and it
  # publishes the `vX.Y.Z` release. `types: [published]` covers both a normal
  # release and a draft being published later.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        default: staging
        type: choice
        options:
          - staging
          - prod
      stack-filter:
        description: >-
          CDK stack glob, WITHOUT the Seqtek<Env> prefix (it is prepended from
          `env`). Default `*Compute` redeploys just the app tier. Use `*` for a
          full-environment deploy — required for the first deploy into a new
          account.
        default: '*Compute'
        type: string

permissions:
  id-token: write
  contents: read
  deployments: write # so the GitHub Environment records the deployment

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-east-1
  ECR_REPOSITORY: seqtek-website

# Pairs with CloudFormation's native stack-update lock — a second run started
# while one is in flight queues rather than racing. Never cancel a deploy
# mid-flight (FR-016). Keyed per env so a prod deploy never queues behind a
# staging one.
concurrency:
  group: deploy-${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') && 'prod' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    # `production` is the conventional GitHub Environment name and is where a
    # required-reviewer gate would hang; staging stays `staging`. Job-level
    # `env:` is not in scope for `environment:`/`concurrency:`, so the
    # is-this-prod test is spelled out in each of those.
    environment:
      ${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') && 'production' ||
      'staging' }}
    outputs:
      site-url: ${{ steps.site.outputs.url }}
    env:
      # A release publish is ALWAYS prod; everything else honours the dispatch
      # input and defaults to staging. STACK_PREFIX must match `stackName()` in
      # infra/lib/construct-utils.ts: 'staging' → SeqtekStaging*, 'prod' → SeqtekProd*.
      ENV_NAME:
        ${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') && 'prod' ||
        'staging' }}
      STACK_PREFIX:
        ${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') && 'SeqtekProd' ||
        'SeqtekStaging' }}
      ROLE_NAME: ${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') &&
        'SeqtekProdDeploy' || 'SeqtekStagingDeploy' }}
      STACK_FILTER:
        ${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') && 'SeqtekProd' ||
        'SeqtekStaging' }}${{ github.event.inputs.stack-filter || '*Compute' }}
    steps:
      # On a release, build the TAGGED commit, not whatever main has drifted
      # to since the release PR merged.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Configure AWS credentials (${{ env.ENV_NAME }} OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-deploy-${{ env.ENV_NAME }}-${{ github.run_id }}

      - name: Resolve ECR registry + image tags
        id: img
        run: |
          set -euo pipefail
          REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          SHA_TAG="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          # On a release, also tag the image with the version so a running
          # production instance can be traced back to a CHANGELOG entry rather
          # than a bare SHA. Empty on staging; the extra tag line is dropped.
          VERSION_TAG=""
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION_TAG="${{ github.event.release.tag_name }}"
          fi
          {
            echo "registry=${REGISTRY}"
            echo "image=${IMAGE}"
            echo "sha-tag=${SHA_TAG}"
            echo "version-tag=${VERSION_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: ECR login
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.img.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.sha-tag }}
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.version-tag != '' && format('{0}:{1}', steps.img.outputs.image, steps.img.outputs.version-tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* client IDs are build-time-inlined into the browser
          # bundle, so runtime SSM provisioning can't deliver them — they ride
          # as build args. All values are public by definition (shipped to
          # every visitor's browser; portal ID + workshop GUID are committed
          # in INTEGRATIONS.md §1.2). CI's own builds pass no args, keeping
          # test runs hermetic (forms stay in stub mode there by design).
          #
          # NEXT_PUBLIC_HUBSPOT_CONTACT_FORM_ID set 2026-06-22: Chad created the
          # Contact form; the GUID was verified by a test submit (all fields
          # accepted, CAPTCHA off — INTEGRATIONS.md §1.2). Live on next deploy.
          #
          # Deliberately EMPTY until their gates clear:
          #  - NEXT_PUBLIC_GTM_ID: GTM-54KBJ2Z3 is the LIVE Wix-era container;
          #    loading it on staging before the spec 008 container rebuild
          #    would fire its legacy tags uncontrolled. Set it as part of the
          #    spec 008 GTM-UI/staging tail.
          build-args: |
            NEXT_PUBLIC_HUBSPOT_PORTAL_ID=8504846
            NEXT_PUBLIC_HUBSPOT_WORKSHOP_FORM_ID=66dba2bf-f099-44d5-8c6e-f24292cefe53
            NEXT_PUBLIC_HUBSPOT_CONTACT_FORM_ID=8dc61ff4-9f95-46c5-b43e-8c82a394de42
            NEXT_PUBLIC_GTM_ID=

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install infra dependencies
        run: npm --prefix infra ci

      - name: cdk deploy (${{ env.STACK_FILTER }})
        run: |
          npm --prefix infra run cdk -- deploy -c env="$ENV_NAME" "$STACK_FILTER" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Trigger ASG instance refresh
        # cdk deploy of *Compute does NOT change the LaunchTemplate when the
        # only effective change is the upstream `:latest` image content
        # (the UserData is byte-identical from CDK's POV), so the ASG
        # doesn't auto-refresh. Trigger explicitly so running instances
        # re-pull the just-pushed image.
        run: |
          set -euo pipefail
          ASG_NAME=$(aws cloudformation describe-stack-resources \
            --stack-name "${STACK_PREFIX}Compute" \
            --query "StackResources[?ResourceType=='AWS::AutoScaling::AutoScalingGroup'].PhysicalResourceId | [0]" \
            --output text 2>/dev/null || echo None)
          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" = "None" ]; then
            echo "No ASG resource found in ${STACK_PREFIX}Compute — skipping refresh trigger."
            exit 0
          fi
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":180,"SkipMatching":false}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "Started instance refresh $REFRESH_ID on $ASG_NAME"

      - name: Wait for ASG instance refresh
        # Poll up to 15 min. Pass-through if the stack filter didn't touch
        # an ASG (e.g. observability-only deploy).
        run: |
          set -euo pipefail
          ASG_NAME=$(aws cloudformation describe-stack-resources \
            --stack-name "${STACK_PREFIX}Compute" \
            --query "StackResources[?ResourceType=='AWS::AutoScaling::AutoScalingGroup'].PhysicalResourceId | [0]" \
            --output text 2>/dev/null || echo None)
          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" = "None" ]; then
            echo "No ASG resource found in ${STACK_PREFIX}Compute — skipping refresh wait."
            exit 0
          fi
          echo "ASG: $ASG_NAME"
          for i in $(seq 1 90); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --max-records 1 \
              --query "InstanceRefreshes[0].Status" \
              --output text)
            echo "[$i] instance refresh status: $STATUS"
            case "$STATUS" in
              Successful)
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "Instance refresh terminated in non-success state: $STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out after 15 min waiting for ASG instance refresh."
          exit 1

      - name: Resolve site URL (from ${{ env.STACK_PREFIX }}Edge output)
        id: site
        run: |
          set -euo pipefail
          URL=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_PREFIX}Edge" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue | [0]" \
            --output text)
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "Could not resolve ${STACK_PREFIX}Edge SiteUrl output."
            exit 1
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Post-deploy smoke
    needs: deploy
    runs-on: ubuntu-latest
    # Runs inside the official Playwright image — browsers + system libs
    # preinstalled. The `npx playwright install --with-deps chromium` apt-get
    # hang on bare GH-hosted runners is the reason this job is split out.
    # Bump the tag in lockstep with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Post-deploy smoke
        env:
          # POST_DEPLOY_URL drives the spec under test.
          # PLAYWRIGHT_BASE_URL is what playwright.config.ts checks to skip
          # spinning up the local `npm run dev` webServer — that webServer
          # path needs PAYLOAD_SECRET / DATABASE_URL and is only meant for
          # the PR-time tests job. Setting PLAYWRIGHT_BASE_URL switches us
          # into the external-server branch of the config.
          POST_DEPLOY_URL: ${{ needs.deploy.outputs.site-url }}
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.site-url }}
        run: npx playwright test tests/e2e/post-deploy-smoke.e2e.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-playwright-report
          path: playwright-report/
          retention-days: 7

  notify:
    name: Notify Slack
    needs: [deploy, smoke]
    # Report every staging deploy outcome (success and failure), but stay quiet
    # if the run was cancelled. A failed/skipped `deploy` makes `smoke` skip, so
    # success requires BOTH jobs green.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      workflow-name: Deploy (${{ (github.event_name == 'release' || github.event.inputs.env == 'prod') && 'production' || 'staging' }})
      status: ${{ (needs.deploy.result == 'success' && needs.smoke.result == 'success') && 'success' || 'failure' }}
      site-url: ${{ needs.deploy.outputs.site-url }}
    secrets: inherit
