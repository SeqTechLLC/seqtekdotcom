name: Infra Diff

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/infra-diff.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: cdk diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        run: npm --prefix infra ci

      # Preview account only — staging is retired (deploy.yml, 2026-08-14) and
      # 'prod' is a never-provisioned CDK env with no real infra (see
      # deploy.yml's promotion-model comment), so a diff against it was
      # always misleading. main and Preview both deploy SeqtekPreview* now,
      # so this ONE diff is what either push will actually change.
      - name: Configure AWS credentials (preview OIDC role, read-only diff)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/SeqtekPreviewDeploy
          aws-region: us-east-1
          role-session-name: github-infra-diff-${{ github.run_id }}

      - name: cdk diff (preview)
        # `cdk diff` exits non-zero when there are pending changes — that's
        # the expected state on an infra PR. We still want to capture the
        # output and post the comment, so don't fail the step.
        run: |
          npm --prefix infra run cdk -- diff -c env=preview 'SeqtekPreview*' \
            > diff-preview.txt 2>&1 || true

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MAX = 60000; // stays inside GitHub's 65k comment limit
            const truncate = (label, body) => {
              if (body.length <= MAX) return body;
              return body.slice(0, MAX) + `\n\n[${label} truncated — see workflow run for full output]`;
            };
            const previewDiff = truncate('preview diff', fs.readFileSync('diff-preview.txt', 'utf8'));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- speckit-infra-diff -->';
            const body = [
              marker,
              '### CDK Diff',
              `Workflow run: ${runUrl}`,
              `Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              '',
              'This is what a merge to `main` (→ ww3.seqtek.com) or a push to `Preview` (→ preview.seqtek.com) will change — both deploy the same stacks.',
              '',
              '<details><summary><strong>Preview account</strong> (<code>SeqtekPreview*</code>)</summary>',
              '',
              '```diff',
              previewDiff.trim() || '(no output)',
              '```',
              '',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
